name: Bug report
description: Create a report to help us improve the project
title: "[Bug]: <short description>"
labels: [bug]
projects:
  - "silentlie/2"

body:
  - type: markdown
    attributes:
      value: |
        Please fill out this template to help us identify and fix bugs.

  - type: checkboxes
    attributes:
      label: Is there an existing issue for this?
      description: Please search to see if an issue already exists for the bug you encountered.
      options:
        - label: I have searched the existing issues
          required: true

  - type: textarea
    id: bug-description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
      placeholder: Describe the bug here
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps To Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. In this environment...
        1. With this config...
        1. Run '...'
        1. See error...
    validations:
      required: false

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
      placeholder: Describe what you expected
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain your problem.
      placeholder: Paste image URLs or describe screenshots here
    validations:
      required: false

  - type: input
    id: system-os
    attributes:
      label: Operating System
      description: Your OS (e.g., Windows 11, macOS 13, Ubuntu 22.04)
      placeholder: Enter your OS
    validations:
      required: true

  - type: input
    id: java-version
    attributes:
      label: Java Version
      description: Java version used (e.g., OpenJDK 21)
      placeholder: Enter Java version
    validations:
      required: true

  - type: input
    id: ide
    attributes:
      label: IDE
      description: IDE used (e.g., IntelliJ IDEA 2025.1)
      placeholder: Enter IDE name and version
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy and paste any relevant log output. This will be automatically formatted into code, so no need for backticks.
      render: shell


  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context about the problem here. Include error logs or stack traces if relevant.
      placeholder: Additional details
    validations:
      required: false