name: Feature request
description: Suggest a new feature or improvement to help us enhance the project
title: "[Feature]: <short description>"
labels: [enhancement]

body:
  - type: markdown
    attributes:
      value: |
        Please fill out this template to help us understand your feature request.

  - type: textarea
    id: feature-description
    attributes:
      label: Describe the Feature
      description: Provide a clear and concise description of the feature or improvement you would like to see.
      placeholder: Describe your feature here
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: Explain the problem this feature solves or the benefit it provides.
      placeholder: Describe why this feature is useful
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or workarounds you have considered.
      placeholder: List alternatives or explain why this feature is needed
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, examples, or screenshots that might help us understand your request.
      placeholder: Additional details
    validations:
      required: false